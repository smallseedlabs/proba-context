# proba-context configuration. Validated at start-up; the service refuses to start on an invalid file.
# Reference: docs/CONFIG.md
version: "1"

identity:
  # act_as_assertion: verify the Hub-minted assertion (Authorization Bearer or X-Act-As).
  # firebase_passthrough: verify the caller's Firebase ID token (interactive only; disabled unless configured).
  mode: act_as_assertion
  # Workstation/tests only. Ignored (and refused) when NODE_ENV=production.
  allowLocal: false
  # Cache Hub POST /v1/internal/authorize answers. Off by default.
  authorizeCache:
    enabled: false
    ttlSeconds: 0

# Shared ContextCache adapter. Per-source enable/TTL lives under sources.<kind>.cache (off by default).
cacheStore:
  # memory: in-process LRU (per-replica). redis: shared via REDIS_URL (password required in production).
  backend: memory
  # Set true only when every replica may keep its own copy; documented in CONFIG.md / RUNBOOK.md.
  allowMemoryInProduction: false

# Postgres packet manifests (context_packets). Never stores item text. Production requires DATABASE_URL.
packetStore:
  retentionDays: 7
  # 0 disables the in-process purge timer; migrations/CLI can still purge.
  purgeIntervalMinutes: 60

# One entry per section kind. tokenShare of the enabled sources must add up to at most 1.
sources:
  policy:
    enabled: true
    timeoutMs: 500
    tokenShare: 0.10
    cache:
      enabled: false
      ttlSeconds: 0
      maxEntries: 1000
  task:
    enabled: true
    timeoutMs: 1000
    tokenShare: 0.15
    cache:
      enabled: false
      ttlSeconds: 0
      maxEntries: 1000
  conversation:
    enabled: true
    timeoutMs: 1000
    tokenShare: 0.30
    cache:
      enabled: false
      ttlSeconds: 0
      maxEntries: 1000
  memory:
    enabled: true
    timeoutMs: 1500
    tokenShare: 0.15
    cache:
      enabled: false
      ttlSeconds: 0
      maxEntries: 1000
  audit_history:
    enabled: true
    timeoutMs: 1500
    tokenShare: 0.10
    cache:
      enabled: false
      ttlSeconds: 0
      maxEntries: 1000
  analytics:
    enabled: true
    timeoutMs: 2000
    tokenShare: 0.10
    cache:
      enabled: false
      ttlSeconds: 0
      maxEntries: 1000
  tools:
    enabled: true
    timeoutMs: 500
    tokenShare: 0.10
    cache:
      enabled: false
      ttlSeconds: 0
      maxEntries: 1000

budget:
  defaultTokens: 6000
  maxTokens: 12000
  # Lower numbers are kept first when the budget is tight.
  priorities:
    policy: 0
    task: 1
    conversation: 2
    memory: 3
    audit_history: 4
    analytics: 5
    tools: 6

# Hosts (host or host:port) the service may call. Everything else is refused (SSRF guard).
# Include every host:port used by MEMORY_API_BASE_URL / AUDIT_API_BASE_URL / HUB_BASE_URL / REDIS_URL.
allowedDownstreamHosts:
  - proba-audit:3400
  - proba-memory:3420
  - proba-hub:3300
  - 127.0.0.1:3400
  - 127.0.0.1:3420
  - 127.0.0.1:3300
  - 127.0.0.1:3500
  # Umbrella local compose service names (proba/local/docker-compose.yml).
  - hub:3000
  - audit-api:3100
  - memory-api:3200
  # Redis, where the audit stream and optional source cache live (REDIS_URL must point here).
  - redis:6379
  # Postgres packet store (DATABASE_URL). Host:port must match the URL.
  - postgres:5432
  - context-postgres:5432
  - 127.0.0.1:5432
  - 127.0.0.1:55435

limits:
  maxNeedsPerRequest: 20
  maxItemsPerSource: 50
  maxItemChars: 4000
  maxRequestBytes: 65536

# Hybrid needs loop (Phase 4). After the first template packet the brain may ask typed needs.
needs:
  # Extra needs rounds per step after the template-only packet.
  maxRoundsPerStep: 2
  # Extra share of the base budget on a needs round (0.3 = 30 percent).
  extraTokenShare: 0.3
  kinds:
    memory_search:
      source: memory
      maxItems: 20
      maxTokens: 1500
    analytics_compare:
      source: analytics
      maxItems: 10
      maxTokens: 1000
      # 90d is outside policy for v1; refused with need_out_of_limits.
      allowedWindows: [1d, 7d, 14d, 30d]
    audit_trace:
      source: audit_history
      maxItems: 100
      maxTokens: 2000
    conversation_before:
      source: conversation
      maxItems: 50
      maxTokens: 2000

redaction:
  # Secrets are always redacted. pii also redacts email, phone, card (Luhn), IBAN and SSN.
  pii: true
